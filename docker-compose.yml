services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dch_elearning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dch_elearning
    depends_on:
      - postgres

volumes:
  postgres_data:
